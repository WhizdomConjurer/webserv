server {
	listen 8080;
	host localhost;
	root www;
	index index.html;
	client_max_body_size 1000000;

	location / {
		methods GET POST DELETE;
		root www;
		index index.html;
		autoindex off;
	}

	location /cgi-bin {
		methods GET POST;
		root cgi-bin;
		cgi .py /usr/bin/python3;
		cgi .sh /bin/bash;
	}
	
}
