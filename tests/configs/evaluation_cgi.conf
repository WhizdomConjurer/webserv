server {
	listen 18084;
	host 127.0.0.1;
	root tests/fixtures/www;
	index index.html;
	client_max_body_size 1000000;

	location / {
		methods GET;
		root tests/fixtures/www;
		index index.html;
	}

	location /cgi-bin {
		methods GET POST;
		root cgi-bin;
		cgi .py /usr/bin/python3;
		cgi .sh /bin/bash;
	}
}
