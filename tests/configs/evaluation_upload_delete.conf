server {
	listen 18083;
	host 127.0.0.1;
	root tests/fixtures/www;
	index index.html;
	client_max_body_size 1000000;

	location / {
		methods GET;
		root tests/fixtures/www;
		index index.html;
	}

	location /upload {
		methods POST DELETE;
		root uploads;
		upload_enable on;
		upload_path uploads;
	}
}
