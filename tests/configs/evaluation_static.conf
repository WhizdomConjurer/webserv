server {
	listen 18082;
	host 127.0.0.1;
	root tests/fixtures/www;
	index index.html;
	client_max_body_size 1000000;

	location / {
		methods GET;
		root tests/fixtures/www;
		index index.html;
		autoindex off;
	}

	location /gallery {
		methods GET;
		root tests/fixtures/www/gallery;
		index missing-index.html;
		autoindex on;
	}

	location /private {
		methods GET;
		root tests/fixtures/www/private;
		index missing-index.html;
		autoindex off;
	}

	location /old {
		return https://example.com/evaluation;
	}
}
